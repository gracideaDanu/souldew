<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>souldew player</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; }
  /* the game's picture, sharp pixels, scaled to the frame by lib/nativeplayer.mjs */
  #stage { position: relative; flex: none; }
  #stage.touch-open.touch-dock { display: flex; align-items: center; justify-content: center; gap: 10px; }
  #screen { display: block; image-rendering: pixelated; touch-action: none; cursor: default; }
  #stage.touch-open.touch-dock #screen { width: 66%; height: auto; flex: 0 0 66%; }
  #touch-wrap { position: absolute; right: 4%; bottom: 4%; width: 22%; aspect-ratio: 4 / 3; box-sizing: border-box; padding: 3px; background: #181612; border: 2px solid #d9cfb8; border-radius: 6px; box-shadow: 0 8px 28px #000d; z-index: 2; opacity: .94; touch-action: none; transition: opacity .14s ease, transform .14s ease, width .14s ease; }
  #touch-wrap.mode-fulldex:not(.in-battle), #touch-wrap.mode-center { left: 50%; top: 50%; right: auto; bottom: auto; transform: translate(-50%, -50%); width: 56%; opacity: .98; }
  #touch-wrap.mode-fulldex.in-battle { right: 1.5%; bottom: 1.5%; left: auto; top: auto; transform: none; width: 19%; opacity: .94; }
  #touch-wrap.mode-corner { right: 4%; bottom: 4%; left: auto; top: auto; transform: none; width: 22%; opacity: .90; }
  #stage.touch-open.touch-dock #touch-wrap { position: static; transform: none; width: 34%; flex: 0 0 calc(34% - 10px); opacity: 1; }
  #touch-wrap[hidden] { display: none; }
  #touch-screen { display: block; width: 100%; height: 100%; image-rendering: pixelated; touch-action: none; }
  #wait { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; font: 600 14px/1.4 system-ui, sans-serif; color: #ebe6da; background: #000; }
  /* "Linking…": over the last picture while the game goes into a link session (or back) – no restart, no black screen */
  #linking { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 6px 12px;
    border-radius: 999px; font: 600 13px/1.2 system-ui, sans-serif; color: #ebe6da; background: rgba(12, 12, 14, .78); pointer-events: none; opacity: 0;
    transition: opacity .15s; }
  #linking.on { opacity: 1; }
  #linking i { width: 8px; height: 8px; border-radius: 50%; background: #8fd18f; animation: lk 0.9s ease-in-out infinite alternate; }
  @keyframes lk { from { opacity: .25; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { #linking i { animation: none; } #linking { transition: none; } }
</style>
</head>
<body>
<div id="stage"><canvas id="screen" width="256" height="384"></canvas><div id="touch-wrap" hidden><canvas id="touch-screen" width="256" height="192"></canvas></div></div>
<div id="wait">…</div>
<div id="linking" role="status" aria-live="polite"><i></i><span></span></div>
<script type="module" src="/lib/nativeplayer.mjs"></script>
</body>
</html>
